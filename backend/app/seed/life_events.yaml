# Things that happen to patrons away from the taproom (see app/sim/life.py).
#
# kind    slug, unique; cat = work | family | health | money | good | interest
# weight  how likely it is to be rolled (0 = only ever follows another event via `then`)
# text    third person, no pronouns. Slots: {day} ("on Tuesday"), {since} ("Tuesday"), {job}, {interest}
# keys    words that show up when the person talks about it (used by the realism scorecard)
# days    how many sim days it stays on their mind; the effects fade to nothing by then
# mood    shift to the mood they arrive with (-1..1, ordinary mood spread is about 0.4)
# visit   multiplier on how often they come in; stay multiplier on how long; drinks adds to their drink goal
# reason  overrides why they came (see human.REASON_TEXT); pay forces card
# when    age_min / age_max
# then    arc follow-ons: [{kind, weight, after: [min_days, max_days]}], rolled once when the event is due

# ---------------------------------------------------------------- work
- {kind: slammed_at_work, cat: work, weight: 10, text: "buried at work since {since}, with a deadline nobody warned about", keys: [deadline, slammed, swamped, buried, behind at work], days: 3, mood: -0.25, visit: 0.9, stay: 0.8, drinks: 0, reason: unwind}
